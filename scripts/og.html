<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #131212;
        color: #f2efe9;
        font-family: Georgia, "Palatino Linotype", Palatino, serif;
        overflow: hidden;
        position: relative;
      }
      .sky {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse at 72% 20%, rgba(245,165,36,0.32), transparent 42%),
          radial-gradient(ellipse at 18% 80%, rgba(47,155,138,0.24), transparent 50%),
          #131212;
      }
      img.mark {
        position: absolute;
        right: 48px;
        top: 70px;
        width: 420px;
        opacity: 0.88;
        filter: drop-shadow(0 0 80px rgba(245,165,36,0.25));
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 150px;
        max-width: 640px;
      }
      .kicker {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 18px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #a8a399;
        margin-bottom: 22px;
      }
      h1 {
        font-size: 84px;
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.035em;
        margin: 0;
      }
      em {
        color: #f5a524;
        font-style: italic;
      }
      p {
        font-family: system-ui, sans-serif;
        font-size: 24px;
        color: #a8a399;
        margin-top: 28px;
        max-width: 520px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="sky"></div>
    <img class="mark" src="../public/brand/trike-mark-white.svg" alt="" />
    <div class="copy">
      <div class="kicker">Trike</div>
      <h1>Describe a game.<br />It actually <em>runs</em>.</h1>
      <p>An AI-native game studio in a box. Ship a link.</p>
    </div>
  </body>
</html>
