<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #131212;
        color: #f2efe9;
        font-family: Georgia, "Palatino Linotype", Palatino, serif;
        overflow: hidden;
        position: relative;
      }
      .glow {
        position: absolute;
        right: 80px;
        top: 90px;
        width: 420px;
        height: 420px;
        background: radial-gradient(ellipse at 50% 45%, rgba(245,165,36,0.28), transparent 62%);
      }
      .frame {
        position: absolute;
        right: 72px;
        top: 118px;
        width: 420px;
        height: 390px;
        border: 1px solid rgba(210,180,136,0.28);
        border-bottom: 0;
        box-shadow: inset 0 0 0 12px #0e0d0d;
      }
      img.stamp {
        position: absolute;
        right: 56px;
        bottom: 48px;
        width: 36px;
        opacity: 0.9;
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 168px;
        max-width: 620px;
      }
      .kicker {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 15px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #a8a399;
        margin-bottom: 22px;
      }
      h1 {
        font-size: 72px;
        font-weight: 400;
        line-height: 0.94;
        letter-spacing: -0.04em;
        margin: 0;
      }
      em {
        color: #f5a524;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="frame"></div>
    <img class="stamp" src="../public/brand/trike-mark-white.svg" alt="" />
    <div class="copy">
      <div class="kicker">Trike</div>
      <h1>Describe a game.<br />It actually <em>runs</em>.</h1>
    </div>
  </body>
</html>
