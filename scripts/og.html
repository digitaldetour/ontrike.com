<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #131212;
        color: #f2efe9;
        font-family: Georgia, "Palatino Linotype", Palatino, serif;
        overflow: hidden;
        position: relative;
      }
      .glow {
        position: absolute;
        right: -80px;
        top: -40px;
        width: 720px;
        height: 720px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245,165,36,0.16), transparent 62%);
      }
      img.mark {
        position: absolute;
        right: 40px;
        top: 40px;
        width: 520px;
        opacity: 0.16;
        filter: drop-shadow(0 0 80px rgba(245,165,36,0.2));
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 150px;
        max-width: 640px;
      }
      .kicker {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 18px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #a8a399;
        margin-bottom: 22px;
      }
      h1 {
        font-size: 92px;
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.035em;
        margin: 0;
      }
      p {
        font-family: Inter, system-ui, sans-serif;
        font-size: 24px;
        color: #a8a399;
        margin-top: 28px;
        max-width: 520px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <img class="mark" src="../public/brand/trike-mark-white.svg" alt="" />
    <div class="copy">
      <div class="kicker">Trike</div>
      <h1>Describe a game.<br />Watch it run.</h1>
      <p>An AI-native game IDE. Live preview. Ship to a URL.</p>
    </div>
  </body>
</html>
